apiVersion: batch/v1
kind: Job
metadata:
  name: fix-pg-permissions
  namespace: iot-helm
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers: []
      containers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1001:1001 /bitnami/postgresql && chmod 700 /bitnami/postgresql/data || true"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-iot-helm-db-0
---
