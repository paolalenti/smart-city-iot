apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-helm-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - iot-helm.local
    secretName: iot-tls
  rules:
  - host: iot-helm.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000
