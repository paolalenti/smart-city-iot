apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: iot/locust:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8089
          command: ["locust", "-f", "locustfile.py", "--host=http://api-gateway.iot-helm.svc.cluster.local:8000"]
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
