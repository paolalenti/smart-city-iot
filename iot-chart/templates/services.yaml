# --- Device Manager ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-manager
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-manager
  template:
    metadata:
      labels:
        app: device-manager
    spec:
      containers:
        - name: device-manager
          image: iot/device-manager:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: iot-config
            - secretRef:
                name: iot-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: device-manager
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: device-manager
  ports:
    - port: 8000
      targetPort: 8000
---
# --- Telemetry Ingestor ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingestor
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ingestor
  template:
    metadata:
      labels:
        app: telemetry-ingestor
    spec:
      containers:
        - name: telemetry-ingestor
          image: iot/telemetry:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: iot-config
            - secretRef:
                name: iot-secrets
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: iot-config
                  key: TELEMETRY_POSTGRES_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingestor
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: telemetry-ingestor
  ports:
    - port: 8001
      targetPort: 8001
---
