# Глобальные настройки образов
image:
  pullPolicy: Never
  tag: latest

# Образы микросервисов
services:
  apiGateway:
    image: iot/api-gateway
    tag: latest
  deviceManager:
    image: iot/device-manager
    tag: latest
  telemetry:
    image: iot/telemetry
    tag: latest
  historical:
    image: iot/historical
    tag: latest
  alertEngine:
    image: iot/alert-engine
    tag: latest
  automationService:
    image: iot/automation-service
    tag: latest
  notificationService:
    image: iot/notification-service
    tag: latest

# Секреты
vault:
  server: "http://vault.vault.svc.cluster.local:8200"
  path: "iot-helm"
  role: "iot-helm-role"
  refreshInterval: "15s"

# Хранилище
storage:
  postgresSize: 5Gi
  telemetryPostgresSize: 10Gi
  kafkaSize: 5Gi
  influxdbSize: 10Gi

# Ingress
ingress:
  host: iot-helm.local
  tlsSecret: iot-tls

# Bitnami PostgreSQL (основная БД)
db:
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: iot_user
    password: changeme
    database: iot_db
  primary:
    persistence:
      enabled: true
      size: 5Gi

# Bitnami PostgreSQL (телеметрия)
telemetry-db:
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: iot_user
    password: changeme
    database: iot_telemetry
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Bitnami Redis
redis:
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
