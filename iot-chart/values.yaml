# Глобальные настройки образов
image:
  pullPolicy: Never
  tag: latest

# Секреты
vault:
  server: "http://vault.vault.svc.cluster.local:8200"
  path: "iot-helm"
  role: "iot-helm-role"
  refreshInterval: "15s"

# Хранилище
storage:
  postgresSize: 5Gi
  telemetryPostgresSize: 10Gi
  kafkaSize: 5Gi
  influxdbSize: 10Gi

# Ingress
ingress:
  host: iot-helm.local
  tlsSecret: iot-tls

# Bitnami PostgreSQL (основная БД)
db:
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: iot_user
    password: changeme
    database: iot_db
  primary:
    persistence:
      enabled: true
      size: 5Gi
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true

# Bitnami PostgreSQL (телеметрия)
telemetry-db:
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: iot_user
    password: changeme
    database: iot_telemetry
  primary:
    persistence:
      enabled: true
      size: 5Gi
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true

# Bitnami Redis
redis:
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
