name: CI/CD Pipeline

on:
  push:
    branches:
      - obs
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p $HOME/bin
          curl -Lo $HOME/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x $HOME/bin/kubectl
          curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz \
            | tar xz -C /tmp
          mv /tmp/linux-amd64/helm $HOME/bin/helm
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build and Push with Kaniko
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="registry.kube-system.svc.cluster.local:80"

          declare -A SERVICES
          SERVICES["api-gateway"]="api_gateway"
          SERVICES["device-manager"]="device_manager"
          SERVICES["telemetry"]="telemetry"
          SERVICES["historical"]="hist"
          SERVICES["alert-engine"]="alert_engine"
          SERVICES["automation-service"]="automation_service"
          SERVICES["notification-service"]="notification_service"

          # Чистим артефакты предыдущего запуска
          kubectl delete pvc kaniko-context -n github-runner --ignore-not-found
          kubectl delete pod kaniko-context-helper -n github-runner --ignore-not-found
          sleep 5

          # Создаём PVC для контекста сборки
          cat > /tmp/kaniko-pvc.yaml << 'EOF'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: kaniko-context
            namespace: github-runner
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 500Mi
          EOF
          kubectl apply -f /tmp/kaniko-pvc.yaml

          # Запускаем helper pod для копирования файлов
          cat > /tmp/kaniko-helper.yaml << 'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: kaniko-context-helper
            namespace: github-runner
          spec:
            restartPolicy: Never
            volumes:
            - name: ctx
              persistentVolumeClaim:
                claimName: kaniko-context
            containers:
            - name: helper
              image: busybox:latest
              command: ["sleep", "600"]
              volumeMounts:
              - name: ctx
                mountPath: /context
          EOF
          kubectl apply -f /tmp/kaniko-helper.yaml
          kubectl wait pod/kaniko-context-helper \
            -n github-runner --for=condition=Ready --timeout=60s

          # Копируем все сервисы в PVC
          for service in "${!SERVICES[@]}"; do
            dir="${SERVICES[$service]}"
            echo "Copying $dir → /context/$service"
            kubectl exec -n github-runner kaniko-context-helper \
              -- mkdir -p "/context/$service"
            kubectl cp "${GITHUB_WORKSPACE}/${dir}/." \
              "github-runner/kaniko-context-helper:/context/${service}/"
          done

          kubectl delete pod kaniko-context-helper -n github-runner --ignore-not-found

          # Собираем образы по одному (PVC ReadWriteOnce)
          for service in "${!SERVICES[@]}"; do
            POD_NAME="kaniko-${service}-${SHA:0:7}"
            echo "=== Building $service ==="

            cat > /tmp/kaniko-pod.yaml << EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD_NAME}
            namespace: github-runner
          spec:
            restartPolicy: Never
            volumes:
            - name: ctx
              persistentVolumeClaim:
                claimName: kaniko-context
            containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:latest
              args:
              - "--context=dir:///context/${service}"
              - "--destination=${REGISTRY}/iot/${service}:${SHA}"
              - "--insecure"
              volumeMounts:
              - name: ctx
                mountPath: /context
          EOF
            kubectl apply -f /tmp/kaniko-pod.yaml

            for i in $(seq 1 30); do
              phase=$(kubectl get pod "$POD_NAME" -n github-runner \
                -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
              echo "  $POD_NAME: $phase"
              [ "$phase" = "Succeeded" ] && break
              if [ "$phase" = "Failed" ]; then
                kubectl logs "$POD_NAME" -n github-runner
                exit 1
              fi
              sleep 10
            done

            kubectl delete pod "$POD_NAME" -n github-runner --ignore-not-found
          done

          kubectl delete pvc kaniko-context -n github-runner --ignore-not-found

      - name: Update Helm Chart image tags
        run: |
          SHA="${{ github.sha }}"
          awk -v sha="$SHA" '
            /^services:/ { in_services=1 }
            /^[a-zA-Z]/ { if (!/^services:/) in_services=0 }
            in_services && /^    tag:/ { $0 = "    tag: " sha }
            { print }
          ' iot-chart/values.yaml > /tmp/values_tmp.yaml \
            && mv /tmp/values_tmp.yaml iot-chart/values.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.email "ci@github.com"
          git config user.name "CI Pipeline"
          git add iot-chart/values.yaml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/paolalenti/smart-city-iot.git HEAD:obs

      - name: Helm upgrade
        run: |
          helm upgrade iot ./iot-chart --namespace iot-helm

      - name: ArgoCD Sync
        run: |
          kubectl patch app iot-helm -n argocd \
            --type merge \
            -p '{"operation":{"initiatedBy":{"username":"ci"},"sync":{"revision":"HEAD"}}}'