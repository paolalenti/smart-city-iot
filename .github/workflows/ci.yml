name: CI/CD Pipeline

on:
  push:
    branches:
      - obs
      - main

jobs:
  helm-upgrade:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update image tags in values.yaml
        run: |
          sed -i "s/\(apiGateway:\|deviceManager:\|telemetry:\|historical:\|alertEngine:\|automationService:\|notificationService:\)/\1/" iot-chart/values.yaml
          for service in apiGateway deviceManager telemetry historical alertEngine automationService notificationService; do
            sed -i "/^  $service:/,/tag:/ s/tag: .*/tag: ${{ github.sha }}/" iot-chart/values.yaml
          done

      - name: Helm upgrade
        run: |
          helm upgrade iot ./iot-chart \
            --namespace iot-helm