name: CI/CD Pipeline

on:
  push:
    branches:
      - obs
      - main

jobs:
  helm-upgrade:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update image tags in values.yaml
        run: |
          SHA="${{ github.sha }}"
          awk -v sha="$SHA" '
            /^services:/ { in_services=1 }
            /^[a-zA-Z]/ { if (!/^services:/) in_services=0 }
            in_services && /^    tag:/ { $0 = "    tag: " sha }
            { print }
          ' iot-chart/values.yaml > /tmp/values_tmp.yaml && mv /tmp/values_tmp.yaml iot-chart/values.yaml

      - name: Helm upgrade
        run: |
          helm upgrade iot ./iot-chart \
            --namespace iot-helm