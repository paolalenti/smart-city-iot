name: CI/CD Pipeline

on:
  push:
    branches:
      - obs
      - main

jobs:
  helm-upgrade:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update image tags in values.yaml
        run: |
          echo "Image tag update step: in production this would update tags to ${{ github.sha }}"
          echo "Requires: Kaniko build + push to registry (not yet implemented)"
          echo "Current setup uses imagePullPolicy: Never with pre-loaded minikube images"

      - name: Helm upgrade
        run: |
          helm upgrade iot ./iot-chart \
            --namespace iot-helm

      - name: ArgoCD sync
        run: |
          argocd app sync iot-helm \
            --server localhost:8080 \
            --insecure \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} || true